services:
  - type: web
    name: ghdd-assessment-pro-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: BOOKS_DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
